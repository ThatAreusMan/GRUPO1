<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bodega_Gestión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#EAF0F4;--card:#fff;--ink:#12263F;--mut:#4F6174;--line:#C5D0DB;--hd:#12263F;--ok:#1B6B3D;--okbg:#DCF1E4;--okb:#1E7A46;--warn:#7A4F00;--warnbg:#FFE7A3;--bad:#A8211A;--badbg:#FADAD7;--pk:#E0A100;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1620;--card:#172333;--ink:#EEF3F8;--mut:#9FB0C1;--line:#2B3C50;--hd:#2D5B93;--ok:#7BE0A3;--okbg:#12351F;--warn:#FFD25E;--warnbg:#3D2F08;--bad:#FF9C94;--badbg:#3F1512;--pk:#F2B705;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1620;--card:#172333;--ink:#EEF3F8;--mut:#9FB0C1;--line:#2B3C50;--hd:#2D5B93;--ok:#7BE0A3;--okbg:#12351F;--warn:#FFD25E;--warnbg:#3D2F08;--bad:#FF9C94;--badbg:#3F1512;--pk:#F2B705;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 'Atkinson Hyperlegible',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-bottom:170px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0}.sub{font-size:13px;opacity:.85}
.pill{min-height:44px;padding:0 14px;border-radius:22px;font-weight:700;background:var(--okbg);color:var(--ok)}
.pill.off{background:var(--badbg);color:var(--bad)}
main{padding:14px 16px}h2.h{margin:0 0 10px;font-size:24px}
label{display:block;font-weight:700}
.in{width:100%;min-height:52px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;min-height:128px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile b{font-size:14px;line-height:1.15}.tile i{font-style:normal;font-size:34px}.tile.no{opacity:.5}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.bd{display:inline-block;padding:2px 10px;border-radius:12px;font-size:14px;font-weight:700}
.b0{background:var(--okbg);color:var(--ok)}.b1{background:var(--warnbg);color:var(--warn)}.b2{background:var(--badbg);color:var(--bad)}
.row{display:flex;align-items:center;gap:12px}.row>div{flex:1;min-width:0}
.btn{min-height:52px;padding:0 20px;border-radius:12px;font-weight:700;background:var(--hd);color:#fff}
.go{background:var(--okb);color:#fff}.alt{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.sm{min-height:48px;min-width:48px;border-radius:12px;background:var(--hd);color:#fff;font-size:24px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--line);background:var(--card);white-space:nowrap}
.chip.on{background:var(--hd);color:#fff;border-color:var(--hd)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:2px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;min-height:56px;border-radius:12px;font-size:14px;font-weight:700;color:var(--mut);position:relative}
nav button span{display:block;font-size:22px}nav .on{background:var(--bg);color:var(--ink)}
.dot{position:absolute;top:2px;right:18%;background:var(--bad);color:#fff;border-radius:10px;font-size:12px;padding:0 6px;font-style:normal}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:456px;background:var(--hd);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;z-index:8;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.bar>button:first-child{flex:1;text-align:left;color:#fff}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:30;max-width:90%;text-align:center;font-weight:700}
.ch{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}.ch div{flex:1;background:var(--hd);border-radius:4px 4px 0 0}.ch .pk{background:var(--pk)}
.hl{display:flex;gap:4px;font-size:12px;text-align:center;color:var(--mut);margin-top:4px}.hl span{flex:1}
.vf{height:200px;background:#000;border-radius:12px;position:relative;overflow:hidden}.vf video{width:100%;height:100%;object-fit:cover}
.ln{position:absolute;left:8%;right:8%;height:3px;background:#FF4D4D;top:20%;animation:sc 1.6s ease-in-out infinite alternate}
@keyframes sc{to{top:80%}}@media (prefers-reduced-motion:reduce){.ln{animation:none}}
</style></head><body>
<div class="app"><header><div><h1>Bodega Santa Rosa</h1><div class="sub">Bodega_Gestión</div></div><button class="pill" id="pill" onclick="net()" aria-label="Cambiar estado de conexión (demostración)"></button></header><main></main></div>
<div class="bar" id="bar" hidden></div><nav id="nav"></nav>
<div class="ov" id="ov" hidden onclick="if(event.target===this)closeSheet()"></div>
<div class="toast" id="t" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),M=n=>'S/ '+n.toFixed(2);
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const left=x=>x?Math.round((new Date(x+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5):null;
const hr=()=>new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
const EM={Abarrotes:'🥫',Bebidas:'🥤',Lácteos:'🥛',Limpieza:'🧼'},SL=[['ok','Óptimo','🟢'],['warn','Reorden','🟡'],['bad','Crítico','🔴']];
const TT={v:'Venta rápida',i:'Inventario',a:'Alertas de stock y vencimiento',c:'Balance y cierre de caja'};
const seed=()=>({on:true,pend:0,sync:null,sales:[[8,24,17],[9,41,30],[10,38,28],[11,55,40],[12,72,52],[13,48,35]],p:[
{id:1,n:'Leche Gloria 400 g',e:'🥛',c:'Lácteos',v:4.2,k:3.5,s:3,m:6,x:day(20),o:12},
{id:2,n:'Pan de molde',e:'🍞',c:'Abarrotes',v:8.5,k:6.8,s:12,m:5,x:day(5),o:9},
{id:3,n:'Arroz 1 kg',e:'🍚',c:'Abarrotes',v:4.8,k:4,s:30,m:10,x:null,o:15},
{id:4,n:'Inca Kola 1.5 L',e:'🥤',c:'Bebidas',v:7.5,k:6,s:18,m:6,x:null,o:8},
{id:5,n:'Agua 625 ml',e:'💧',c:'Bebidas',v:1.5,k:1,s:24,m:10,x:null,o:20},
{id:6,n:'Galletas Soda',e:'🍪',c:'Abarrotes',v:1.2,k:.9,s:2,m:6,x:day(3),o:7},
{id:7,n:'Aceite 1 L',e:'🫒',c:'Abarrotes',v:10.5,k:8.9,s:9,m:4,x:null,o:5},
{id:8,n:'Detergente 500 g',e:'🧼',c:'Limpieza',v:3.5,k:2.8,s:14,m:5,x:null,o:4},
{id:9,n:'Yogurt 1 L',e:'🍶',c:'Lácteos',v:6.8,k:5.4,s:8,m:4,x:day(6),o:6},
{id:10,n:'Huevos (unidad)',e:'🥚',c:'Abarrotes',v:.8,k:.6,s:0,m:30,x:null,o:18}]});
let S,T='v',Q='',F='Todos',C={},pay=0,vid;const K='bodega_gestion_v1';
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S||!S.p)S=seed();
const st=p=>{const d=left(p.x);return p.s<=0||(d!==null&&d<=3)?2:p.s<=p.m?1:0};
const P=id=>S.p.find(p=>p.id==id),cart=()=>Object.keys(C).map(id=>[P(id),C[id]]);
const tot=()=>cart().reduce((a,[p,q])=>a+p.v*q,0),cnt=()=>Object.values(C).reduce((a,b)=>a+b,0);
function toast(t){const o=$('#t');o.textContent=t;o.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>o.hidden=true,3000)}
function sheet(h,id=''){const o=$('#ov');o.hidden=false;o.innerHTML=`<div class="sheet"${id?` id="${id}"`:''} role="dialog" aria-modal="true">${h}<button class="btn" style="width:100%;margin-top:10px;background:var(--bg);color:var(--ink)" onclick="closeSheet()">Cerrar</button></div>`}
function closeSheet(){stopCam();$('#ov').hidden=true;$('#ov').innerHTML=''}
function go(k){T=k;Q='';scrollTo(0,0);draw()}
function add(id,d=1){const p=P(id),q=(C[id]||0)+d;if(d>0&&p.s<=0)return toast(p.n+' está agotado');if(q>p.s)return toast('Solo quedan '+p.s+' de '+p.n);if(q<=0)delete C[id];else C[id]=q;bar();if($('#cs'))cnt()?cartSheet():closeSheet()}
function bar(){const b=$('#bar'),n=cnt();b.hidden=!n||T!='v';b.innerHTML=`<button onclick="cartSheet()" aria-label="Ver venta actual"><b>${n} producto${n>1?'s':''}</b><br><span style="font-size:22px;font-weight:700">${M(tot())}</span></button><button class="btn go" onclick="cobrar()">Cobrar venta</button>`}
function grid(){const g=$('#g');if(!g)return;const q=Q.toLowerCase();g.innerHTML=S.p.filter(p=>p.n.toLowerCase().includes(q)).map(p=>`<button class="tile${p.s<=0?' no':''}" onclick="add(${p.id})"><i>${p.e}</i><b>${E(p.n)}</b><span>${M(p.v)}</span><span class="bd b${st(p)}">${SL[st(p)][2]} ${p.s}</span></button>`).join('')||'<p>No se encontró ese producto.</p>'}
function cartSheet(){const t=tot(),v=pay?pay-t:0;sheet(`<h2 style="margin:0 0 8px">Venta actual</h2>`+cart().map(([p,q])=>`<div class="row" style="padding:6px 0"><span style="font-size:28px">${p.e}</span><div><b>${E(p.n)}</b><br>${M(p.v*q)}</div><button class="sm" aria-label="Quitar uno" onclick="add(${p.id},-1)">−</button><b>${q}</b><button class="sm" aria-label="Agregar uno" onclick="add(${p.id})">+</button></div>`).join('')+`<h3 style="margin:14px 0 0">Cliente paga</h3><div class="chips">${[0,10,20,50,100].map(x=>`<button class="chip${pay==x?' on':''}" onclick="pay=${x};cartSheet()">${x?'S/ '+x:'Justo'}</button>`).join('')}</div><p style="font-size:22px;margin:8px 0"><b>Total ${M(t)}</b>${pay?`<br>${v>=0?'Vuelto':'Falta'}: <b>${M(Math.abs(v))}</b>`:''}</p><button class="btn go" style="width:100%" onclick="cobrar()">Cobrar venta</button>`,'cs')}
function cobrar(){if(!cnt())return toast('Elige al menos un producto');const t=tot(),c=cart().reduce((a,[p,q])=>a+p.k*q,0),v=pay?pay-t:0;if(pay&&v<0)return toast('El pago no alcanza. Faltan '+M(-v));
cart().forEach(([p,q])=>{p.s-=q;p.o+=q});S.sales.push([Math.min(Math.max(new Date().getHours(),8),21),t,c]);if(!S.on)S.pend++;const had=pay;C={};pay=0;save();closeSheet();draw();toast('Venta cobrada: '+M(t)+'.'+(had?' Vuelto '+M(v)+'.':'')+(S.on?'':' Guardada sin conexión.'))}
function scan(){sheet(`<h2 style="margin:0 0 8px">Escanear código</h2><div class="vf"><video id="vd" autoplay playsinline muted></video><div class="ln"></div></div><p style="color:var(--mut)">Apunta la cámara al código de barras del empaque.</p><button class="btn go" style="width:100%" onclick="fake()">Simular lectura de código</button>`);
try{navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{if($('#vd')){vid=s;$('#vd').srcObject=s}else s.getTracks().forEach(t=>t.stop())}).catch(()=>{})}catch(e){}}
function stopCam(){if(vid){vid.getTracks().forEach(t=>t.stop());vid=null}}
function fake(){const a=S.p.filter(p=>p.s>0),p=a[Math.floor(Math.random()*a.length)];add(p.id);toast('Código leído: '+p.n)}
const vSell=()=>`<input class="in" id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto" value="${E(Q)}" oninput="Q=this.value;grid()"><button class="btn alt" style="width:100%;margin-top:10px" onclick="scan()">📷 Escanear código de barras</button><div class="grid" id="g"></div>`;
function vInv(){return `<button class="btn go" style="width:100%" onclick="newP()">+ Registrar producto nuevo</button><div class="chips">${['Todos',...Object.keys(EM)].map(c=>`<button class="chip${F==c?' on':''}" onclick="F='${c}';draw()">${c}</button>`).join('')}</div>`+S.p.filter(p=>F=='Todos'||p.c==F).map(p=>{const s=st(p),d=left(p.x);return `<div class="card row"><span style="font-size:34px">${p.e}</span><div><b>${E(p.n)}</b><br><span style="color:var(--mut)">Stock ${p.s} · ${M(p.v)}${d!==null?(d<0?' · vencido':' · vence en '+d+' d'):''}</span><br><span class="bd b${s}">${SL[s][2]} ${SL[s][1]}</span></div><button class="sm" aria-label="Agregar stock de ${E(p.n)}" onclick="restock(${p.id})">+</button></div>`}).join('')}
function restock(id){const p=P(id);sheet(`<h2 style="margin:0">Agregar stock</h2><p>${p.e} ${E(p.n)}. Stock actual: ${p.s}</p><label>Unidades recibidas<input class="in" id="rq" type="number" inputmode="numeric" min="1" value="10" style="margin-top:4px"></label><button class="btn go" style="width:100%;margin-top:12px" onclick="doRe(${id})">Agregar al stock</button>`)}
function doRe(id){const n=parseInt($('#rq').value);if(!(n>0))return toast('Escribe cuántas unidades llegaron');const p=P(id);p.s+=n;save();closeSheet();draw();toast(p.n+': ahora hay '+p.s+' unidades')}
function newP(){const fl=(i,l,t)=>`<label>${l}<input class="in" id="${i}" type="${t}"${t=='number'?' inputmode="decimal" step="any" min="0"':''} style="margin:4px 0 10px"></label>`;
sheet(`<h2 style="margin:0 0 8px">Producto nuevo</h2>${fl('nn','Nombre','text')}<label>Categoría<select class="in" id="ncat" style="margin:4px 0 10px">${Object.keys(EM).map(c=>`<option>${c}</option>`).join('')}</select></label>${fl('nc','Precio de costo (S/)','number')}${fl('nv','Precio de venta (S/)','number')}${fl('ns','Stock inicial','number')}${fl('nm','Stock mínimo para reponer','number')}${fl('nx','Fecha de vencimiento (opcional)','date')}<button class="btn go" style="width:100%" onclick="doNew()">Guardar producto</button>`)}
function doNew(){const g=i=>$('#'+i).value,n=g('nn').trim(),v=+g('nv');if(!n)return toast('Escribe el nombre del producto');if(!(v>0))return toast('Escribe el precio de venta');
S.p.push({id:Date.now(),n,e:EM[g('ncat')],c:g('ncat'),v,k:+g('nc')||0,s:parseInt(g('ns'))||0,m:parseInt(g('nm'))||0,x:g('nx')||null,o:0});save();closeSheet();draw();toast(n+' registrado')}
function vAl(){const a=S.p.map(p=>[p,st(p),left(p.x)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
if(!a.length)return '<div class="card"><b>Todo en orden</b><p style="margin:4px 0 0">No hay productos por reponer ni por vencer.</p></div>';
return a.map(([p,s,d])=>{let t,h;const u=p.s==1?'1 unidad':p.s+' unidades';
if(p.s<=0){t=p.n+' está agotado';h='Pedir al proveedor hoy.'}
else if(d!==null&&d<=3){t=p.n+': '+(d<0?'venció hace '+(-d)+' días':d==0?'vence hoy':'vence en '+d+' días')+' ('+u+')';h='Aplicar descuento u oferta para venderlas.'}
else{t=(p.s==1?'Queda 1 unidad':'Quedan '+p.s+' unidades')+' de '+p.n;h='Solicitar pedido al proveedor.'}
return `<div class="card b${s}" style="border-color:currentColor"><div class="row"><span style="font-size:34px">${p.e}</span><div><b>${SL[s][2]} ${t}</b><br>${h}</div></div></div>`}).join('')}
function vCa(){const t=S.sales.reduce((a,s)=>a+s[1],0),c=S.sales.reduce((a,s)=>a+s[2],0),H=Array.from({length:14},(_,i)=>8+i),b=H.map(h=>S.sales.filter(s=>s[0]==h).reduce((a,s)=>a+s[1],0)),m=Math.max(...b),mx=m||1,pk=b.indexOf(m),top=[...S.p].sort((a,b)=>b.o-a.o).slice(0,3);
return `<div class="row"><div class="card" style="flex:1">Total vendido<br><b style="font-size:22px">${M(t)}</b></div><div class="card" style="flex:1">Costo de mercadería<br><b style="font-size:22px">${M(c)}</b></div></div>
<div class="card" style="background:var(--okbg);color:var(--ok);border-color:var(--ok)">Ganancia neta real<br><b style="font-size:38px">${M(t-c)}</b></div>
<div class="card"><b>Ventas por hora</b><div class="ch" role="img" aria-label="Hora de mayor venta: ${H[pk]} horas">${b.map((x,i)=>`<div class="${i==pk?'pk':''}" style="height:${Math.max(x/mx*100,2)}%" title="${H[i]} h: ${M(x)}"></div>`).join('')}</div><div class="hl">${H.map(h=>`<span>${h}</span>`).join('')}</div><p style="margin:8px 0 0">Hora de mayor afluencia: <b>${H[pk]}:00</b></p></div>
<div class="card"><b>Más vendidos</b>${top.map((p,i)=>`<div class="row" style="padding:6px 0"><b>${i+1}</b><span style="font-size:26px">${p.e}</span><div>${E(p.n)}</div><b>${p.o} u.</b></div>`).join('')}</div>
<p>${S.pend?'⏳ Ventas pendientes de sincronizar: '+S.pend:S.sync?'✔ Sincronizado a las '+S.sync:'Aún no se ha sincronizado hoy'}</p>
<button class="btn go" style="width:100%" onclick="cierre()">Cerrar día y sincronizar</button><button class="chip" style="margin-top:14px" onclick="reset()">Reiniciar demo</button>`}
function cierre(){if(!S.on)return toast('Sin conexión. Los datos siguen guardados en el teléfono.');S.pend=0;S.sync=hr();save();draw();toast('Día cerrado y datos sincronizados')}
function net(){S.on=!S.on;let m='Sin conexión: las ventas se guardan en el teléfono';if(S.on){m='Conexión recuperada';if(S.pend){m+='. '+S.pend+' ventas sincronizadas';S.pend=0;S.sync=hr()}}save();draw();toast(m)}
function reset(){S=seed();C={};save();draw();toast('Demo reiniciada')}
function draw(){const pl=$('#pill');pl.className='pill'+(S.on?'':' off');pl.textContent=S.on?'● En línea':'● Sin conexión';
const al=S.p.filter(p=>st(p)>0).length;
$('#nav').innerHTML=[['v','🛒','Vender'],['i','📦','Inventario'],['a','🔔','Alertas'],['c','📊','Caja']].map(([k,e,l])=>`<button class="${T==k?'on':''}" onclick="go('${k}')"><span>${e}</span>${l}${k=='a'&&al?`<em class="dot" aria-label="${al} alertas">${al}</em>`:''}</button>`).join('');
$('main').innerHTML=`<h2 class="h">${TT[T]}</h2>`+({v:vSell,i:vInv,a:vAl,c:vCa}[T])();grid();bar()}
draw();
</script></body></html>
